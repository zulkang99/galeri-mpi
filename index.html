<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Media Pembelajaran Interaktif</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion & Lucide Icons -->
    <script src="https://bundle.run/framer-motion@10.16.4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        /* Pre-loader simple CSS */
        #loader {
            position: fixed; inset: 0; background: #f8fafc; display: flex;
            justify-content: center; items-center; z-index: 9999; transition: opacity 0.5s ease;
        }
        .dark #loader { background: #020617; }
        .spinner { width: 40px; height: 40px; border: 4px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300">
    
    <div id="loader"><div class="spinner"></div></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const motion = window.Motion ? window.Motion.motion : { div: 'div', h1: 'h1', p: 'p', nav: 'nav', header: 'header', section: 'section' };
        const AnimatePresence = window.Motion ? window.Motion.AnimatePresence : ({children}) => <>{children}</>;

        const MPI_DATA = [
            {
                id: 1,
                title: "Gudang Sortir",
                category: "Matematika",
                description: "Simulasi sortir bangun datar berdasarkan sifat dan bentuknya.",
                longDescription: "Media ini dirancang agar siswa dapat mengelompokkan bangun datar berdasarkan sifat dan bentuknya.",
                learningGoal: "mengidentifikasi bangun datar.",
                tech: ["HTML5", "Canvas", "Tailwind"],
                image: "https://i.ibb.co.com/dwcLDj4Y/Screenshot-2026-05-11-132950.png",
                url: "https://gudangsortir.netlify.app/"
            },
            {
                id: 2,
                title: "Simulator Rasio Minuman",
                category: "Matematika",
                description: "Visualisasi perbandingan melalui eksperimen mencampur bahan minuman virtual.",
                longDescription: "Siswa belajar konsep rasio dengan mencampurkan sirup dan air untuk memahami konsep perbandingan secara visual.",
                learningGoal: "Memahami konsep rasio dalam kehidupan sehari-hari.",
                tech: ["HTML5", "Canvas", "Tailwind"],
                image: "https://i.ibb.co.com/DDJYp3rs/Screenshot-2026-05-11-140939.png",
                url: "https://caferasio.netlify.app/"
            },
            {
                id: 3,
                title: "Simulasi Energi Terbarukan",
                category: "IPAS",
                description: "Simulator interaktif untuk memahami cara kerja panel surya dan turbin angin.",
                longDescription: "Media ini dirancang agar siswa dapat bereksperimen dengan intensitas cahaya dan kecepatan angin untuk melihat output energi listrik secara real-time.",
                learningGoal: "Menganalisis faktor yang mempengaruhi efisiensi energi terbarukan.",
                tech: ["HTML5", "Canvas", "Tailwind"],
                image: "https://i.ibb.co.com/rGmn8TLR/Screenshot-2026-05-11-141646.png",
                url: "https://eduenergi.netlify.app/"
            },
            {
                id: 4,
                title: "Laporan Kegiatan Bulan Ramadhan",
                category: "Pend. Agama Islam",
                description: "Laporan ini berfungi sebagai jurnal harian kegiatan yang dilaksanakan oleh murid selama bulan.",
                longDescription: "Laporan ini berfungsi sebagai jurnal harian kegiatan murid selama satu bulan pembelajaran. Setiap aktivitas belajar, tugas, dan proyek dicatat untuk memantau perkembangan, kedisiplinan, serta tanggung jawab murid. Selain itu, laporan ini menjadi sarana refleksi dan evaluasi agar proses belajar berlangsung lebih terarah, terukur, dan berkesinambungan..",
                learningGoal: "Melaksanakan kegiatan bulan ramadhan dengan istiqomah.",
                tech: ["HTML5", "Canvas", "Tailwind"],
                image: "https://i.ibb.co.com/HTthdZRJ/Screenshot-2026-05-11-141812.png",
                url: "https://ramadhan-sdn4bnw.netlify.app/"
            },
            {
                id: 5,
                title: "Robocoder V2.5",
                category: "Koding & KA",
                description: "Media interaktif belajar pemrograman dasar untuk anak melalui simulasi robot.",
                longDescription: "RoboCoder AI adalah media pembelajaran berbasis gim yang melatih logika pemrograman anak dengan menyusun blok perintah untuk menggerakkan robot menyelesaikan misi..",
                learningGoal: "Melatih logika pemrograman dasar dan berpikir komputasional anak melalui penyusunan blok perintah robot.",
                tech: ["HTML5", "Canvas", "Tailwind"],
                image: "https://i.ibb.co.com/XkvmdNQG/Screenshot-2026-05-14-020225.png",
                url: "https://robocoder.netlify.app/"
            },
            {
                id: 6,
                title: "Trouble Calculator",
                category: "Koding & KA",
                description: "Game tantangan matematika interaktif memecahkan angka target dengan tombol terbatas.",
                longDescription: "Media simulasi kalkulator unik di mana siswa harus berpikir kritis menggunakan tombol operasi terbatas untuk mencapai target angka satu hingga dua puluh.",
                learningGoal: "Melatih kemampuan logika, operasi hitung bilangan, dan kreativitas memecahkan masalah.",
                tech: ["HTML5", "Canvas", "Tailwind"],
                image: "https://i.ibb.co.com/qXGm0Fc/Screenshot-2026-05-14-020213.png",
                url: "https://trouble-calculator.netlify.app/"
            }
        ];

       const CATEGORIES = ["Semua", "Matematika", "IPAS", "Bahasa Indonesia", "Koding & KA", "Pend. Agama Islam"];

        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [selectedCategory, setSelectedCategory] = useState("Semua");
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedMPI, setSelectedMPI] = useState(null);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                // Menghilangkan loader saat React siap
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
                
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const filteredData = useMemo(() => {
                return MPI_DATA.filter(item => {
                    const matchesCat = selectedCategory === "Semua" || item.category === selectedCategory;
                    const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase());
                    return matchesCat && matchesSearch;
                });
            }, [selectedCategory, searchTerm]);

            return (
                <div className={darkMode ? 'dark' : ''}>
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
                        
                        {/* Header / Navbar */}
                        <nav className={`fixed top-0 w-full z-50 transition-all ${scrolled ? 'bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6'}`}>
                            <div className="container mx-auto px-6 flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    {/* Logo Image */}
                                    <img 
                                        src="https://i.ibb.co.com/Xn0p0Z8/Desain-tanpa-judul-17.png" 
                                        alt="Logo MPI Gallery" 
                                        className="h-10 w-auto object-contain rounded-lg"
                                    />
                                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 font-bold text-xl hidden sm:block">
                                        MPI Gallery
                                    </span>
                                </div>
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-slate-600 dark:text-yellow-400">
                                        {darkMode ? <i data-lucide="sun"></i> : <i data-lucide="moon"></i>}
                                    </button>
                                    <button className="hidden md:block bg-primary text-white px-6 py-2 rounded-full font-semibold text-sm hover:bg-blue-700 transition-all shadow-lg shadow-blue-500/20">Kontak</button>
                                </div>
                            </div>
                        </nav>

                        {/* Hero Section */}
                        <header className="pt-40 pb-20 px-6 text-center">
                            <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }}>
                                <h1 className="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight text-slate-900 dark:text-white">
                                    Galeri Media Pembelajaran<br/>
                                    <span className="text-primary">Interaktif Digital</span>
                                </h1>
                                <p className="text-slate-600 dark:text-slate-300 max-w-2xl mx-auto text-lg mb-10">
                                    Koleksi karya inovatif untuk menghadirkan pengalaman belajar yang menyenangkan bagi siswa di era digital.
                                </p>
                                <div className="flex justify-center gap-4">
                                    <a href="#karya" className="bg-primary text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-blue-500/30 hover:scale-105 transition-transform">Lihat Karya</a>
                                    <a href="#tentang" className="bg-white dark:bg-slate-800 text-slate-900 dark:text-white px-8 py-3 rounded-full font-bold border dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">Tentang Saya</a>
                                </div>
                            </motion.div>
                        </header>

                        {/* Filter & Search Section */}
                        <section id="karya" className="py-12 container mx-auto px-6">
                            <div className="glass-card p-4 rounded-3xl mb-12 flex flex-col md:flex-row gap-4 items-center">
                                <div className="relative flex-1 w-full">
                                    <div className="absolute inset-y-0 left-4 flex items-center text-slate-400">
                                        <i data-lucide="search" className="w-5 h-5"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Cari media..." 
                                        className="w-full bg-slate-100 dark:bg-slate-800/50 rounded-2xl py-3 pl-12 pr-4 outline-none focus:ring-2 ring-primary text-slate-700 dark:text-slate-100"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                <div className="flex gap-2 overflow-x-auto w-full md:w-auto no-scrollbar py-2 md:py-0">
                                    {CATEGORIES.map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-5 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-primary text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Card Grid */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                {filteredData.map(item => (
                                    <motion.div 
                                        layout
                                        initial={{ opacity: 0 }}
                                        animate={{ opacity: 1 }}
                                        key={item.id}
                                        className="group bg-white dark:bg-slate-900 rounded-[2.5rem] overflow-hidden border border-slate-100 dark:border-slate-800 hover:shadow-2xl transition-all duration-300"
                                    >
                                        <div className="relative h-48 overflow-hidden cursor-pointer" onClick={() => setSelectedMPI(item)}>
                                            <img src={item.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={item.title} />
                                            <div className="absolute top-4 left-4 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold text-primary uppercase shadow-sm">{item.category}</div>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="font-bold text-xl mb-2 text-slate-900 dark:text-slate-100 group-hover:text-primary transition-colors cursor-pointer" onClick={() => setSelectedMPI(item)}>{item.title}</h3>
                                            <p className="text-sm text-slate-500 dark:text-slate-400 mb-6 line-clamp-2">{item.description}</p>
                                            <div className="flex gap-2">
                                                <button onClick={() => setSelectedMPI(item)} className="flex-1 bg-slate-100 dark:bg-slate-800 py-3 rounded-2xl text-xs font-bold hover:bg-primary hover:text-white transition-all text-slate-700 dark:text-slate-200">Detail</button>
                                                <a href={item.url} target="_blank" className="bg-primary text-white p-3 rounded-2xl hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/20 active:scale-90" title="Buka Website">
                                                    <i data-lucide="external-link" className="w-5 h-5"></i>
                                                </a>
                                            </div>
                                        </div>
                                    </motion.div>
                                ))}
                            </div>
                            
                            {filteredData.length === 0 && (
                                <div className="text-center py-20">
                                    <p className="text-slate-400 italic">Tidak ada media yang sesuai dengan pencarian Anda.</p>
                                </div>
                            )}
                        </section>

                        {/* About Section */}
                        <section id="tentang" className="py-24 bg-slate-100 dark:bg-slate-900/50">
                            <div className="container mx-auto px-6 flex flex-col md:flex-row items-center gap-12">
                                <div className="md:w-1/3">
                                    <div className="w-64 h-64 mx-auto rounded-[3rem] overflow-hidden border-8 border-white dark:border-slate-800 shadow-2xl transform -rotate-3 hover:rotate-0 transition-transform duration-500">
                                        <img src="https://i.ibb.co.com/NgNdRMCD/profil-2.png" className="w-full h-full object-cover" alt="Profile Zulkifli" />
                                    </div>
                                </div>
                                <div className="md:w-2/3 text-center md:text-left">
                                    <h2 className="text-3xl md:text-4xl font-bold mb-6 text-slate-900 dark:text-white">Membangun Masa Depan Melalui <span className="text-primary">Inovasi Digital</span></h2>
                                    <p className="text-slate-600 dark:text-slate-300 mb-8 text-lg leading-relaxed">Seorang pendidik yang berdedikasi menciptakan media pembelajaran interaktif untuk memudahkan pemahaman siswa dan membuat proses belajar menjadi lebih efisien serta bermakna.</p>
                                    <div className="flex justify-center md:justify-start gap-8">
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Footer Section */}
                        <footer className="py-12 text-center text-slate-500 dark:text-slate-400 text-sm border-t dark:border-slate-800">
                            <p className="mb-2">Dikreasikan oleh <span className="text-slate-800 dark:text-slate-200 font-semibold tracking-wide">Zulkifli, M.Pd</span></p>
                            <p className="text-xs uppercase tracking-[0.3em] font-medium opacity-70">SDN 4 Banawa</p>
                        </footer>

                        {/* Modal Detail Section */}
                        <AnimatePresence>
                            {selectedMPI && (
                                <div className="fixed inset-0 z-[100] flex items-center justify-center p-6">
                                    <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={() => setSelectedMPI(null)} className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" />
                                    <motion.div initial={{ scale: 0.9, opacity: 0, y: 20 }} animate={{ scale: 1, opacity: 1, y: 0 }} exit={{ scale: 0.9, opacity: 0, y: 20 }} className="relative bg-white dark:bg-slate-900 w-full max-w-4xl rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
                                        <div className="md:w-1/2 h-56 md:h-auto">
                                            <img src={selectedMPI.image} className="w-full h-full object-cover" alt={selectedMPI.title} />
                                        </div>
                                        <div className="md:w-1/2 p-8 md:p-10 overflow-y-auto no-scrollbar relative">
                                            <button onClick={() => setSelectedMPI(null)} className="absolute top-6 right-6 p-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-900/30 text-slate-500 hover:text-red-500 transition-colors">
                                                <i data-lucide="x" className="w-5 h-5"></i>
                                            </button>
                                            <span className="text-primary font-bold text-xs uppercase tracking-[0.2em]">{selectedMPI.category}</span>
                                            <h2 className="text-3xl font-extrabold mt-2 mb-6 pr-8 leading-tight text-slate-900 dark:text-white">{selectedMPI.title}</h2>
                                            
                                            <div className="space-y-6 mb-10 text-left">
                                                <div>
                                                    <h4 className="font-bold text-[10px] uppercase text-slate-400 tracking-widest mb-2 flex items-center gap-2">
                                                        <i data-lucide="info" className="w-3 h-3"></i> Deskripsi
                                                    </h4>
                                                    <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">{selectedMPI.longDescription}</p>
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-[10px] uppercase text-slate-400 tracking-widest mb-2 flex items-center gap-2">
                                                        <i data-lucide="target" className="w-3 h-3"></i> Tujuan Pembelajaran
                                                    </h4>
                                                    <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">{selectedMPI.learningGoal}</p>
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-[10px] uppercase text-slate-400 tracking-widest mb-3 flex items-center gap-2">
                                                        <i data-lucide="code" className="w-3 h-3"></i> Teknologi
                                                    </h4>
                                                    <div className="flex gap-2 flex-wrap">
                                                        {selectedMPI.tech.map(t => <span key={t} className="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg text-[10px] font-semibold tracking-wide">{t}</span>)}
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <a href={selectedMPI.url} target="_blank" className="block w-full bg-primary hover:bg-blue-700 text-white text-center py-4 rounded-2xl font-bold shadow-xl shadow-blue-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                                                Buka Media Pembelajaran <i data-lucide="external-link" className="w-4 h-4"></i>
                                            </a>
                                        </div>
                                    </motion.div>
                                </div>
                            )}
                        </AnimatePresence>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
